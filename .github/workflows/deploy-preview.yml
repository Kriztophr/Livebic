# Deploys the new build (API + web, sandbox mode) as one container to an Azure Web App.
#
# One-time setup in Azure, then this runs on every push to the branch below:
#   1. Create a Web App: Linux, "Container" publishing, any small plan (B1 is enough).
#   2. In the app's Configuration, set WEBSITES_PORT = 3000. The API is reached through the web app's
#      /api-proxy path on the same host, so nothing else needs exposing.
#   3. Download the app's publish profile and save it as the repository secret AZURE_PREVIEW_PUBLISH_PROFILE.
#   4. Set the repository variable AZURE_PREVIEW_APP_NAME to the Web App's name.
#
# The image is pushed to GitHub's container registry (ghcr.io) using the built-in GITHUB_TOKEN.

name: Deploy preview (new build)

on:
  push:
    branches: [claude/new-session-sl9hv4]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: vars.AZURE_PREVIEW_APP_NAME != ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/livebic-preview:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.AZURE_PREVIEW_APP_NAME }}.azurewebsites.net/api-proxy
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_PREVIEW_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PREVIEW_PUBLISH_PROFILE }}
          images: ghcr.io/${{ github.repository_owner }}/livebic-preview:${{ github.sha }}
